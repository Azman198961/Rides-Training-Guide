<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pathao Rides CX Training Portal</title>
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Header / Navigation Bar -->
  <header class="header">
    <div class="logo-container" id="go-home">
      <span class="ride-icon-logo"><i class="fa-solid fa-motorcycle"></i></span>
      <span class="brand-name">pathao <small>CX</small></span>
    </div>
    <div class="lang-switch">
      <button class="lang-btn active" id="lang-bn">বাংলা</button>
      <button class="lang-btn" id="lang-en">English</button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">

    <!-- TOPICS GRID VIEW -->
    <section id="topics-view" class="view active-view">
      <div class="view-header">
        <h2 id="topics-title">একটি ট্রেনিং টপিক নির্বাচন করুন</h2>
      </div>
      <div class="topics-grid" id="topics-grid"></div>
    </section>

    <!-- DETAIL VIEW -->
    <section id="detail-view" class="view">
      <div class="view-header">
        <button id="back-btn" class="back-btn">
          <i class="fas fa-chevron-left"></i> <span id="back-btn-text">সব টপিক</span>
        </button>
      </div>
      
      <div class="detail-container">
        <h1 id="detail-title" class="detail-header-title"></h1>
        <div id="detail-content" class="content-body"></div>
      </div>
    </section>

  </main>

  <!-- External JavaScript Files -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
